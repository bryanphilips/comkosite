<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Private Sale Offer</title>
</head>
<body style="margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;background:#f6f9fc">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr><td align="center" style="padding:24px">
      <table width="620" cellpadding="0" cellspacing="0" role="presentation" style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden">
        <tr><td style="background:#0A4E73;color:#fff;padding:16px 20px;font-weight:800">
          Private Sale Offer — {{APP_NAME}}
        </td></tr>
        <tr><td style="padding:20px">
          <p>Hi <strong>{{NAME}}</strong>,</p>
          <p>Thanks for your Private Sale offer. We’ve received your details:</p>

          <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="margin:12px 0;border-collapse:collapse">
            <tr><td style="padding:6px 8px;border:1px solid #e5e7eb;width:160px"><strong>Reference</strong></td><td style="padding:6px 8px;border:1px solid #e5e7eb">{{REF}}</td></tr>
            <tr><td style="padding:6px 8px;border:1px solid #e5e7eb"><strong>Date</strong></td><td style="padding:6px 8px;border:1px solid #e5e7eb">{{DATE}}</td></tr>
            <tr><td style="padding:6px 8px;border:1px solid #e5e7eb"><strong>Garden Mark</strong></td><td style="padding:6px 8px;border:1px solid #e5e7eb">{{GARDEN_MARK}}</td></tr>
          </table>

          <div style="margin:14px 0">
            {{LINES_HTML}}
          </div>

          <p><strong>Contact me:</strong> {{CONTACT_ME}}</p>
          <p style="margin-top:16px"><a href="{{PORTAL_URL}}" style="color:#218CCF;text-decoration:none">Visit Website</a></p>
          <p style="color:#64748b;font-size:13px">If you didn’t submit this offer, contact us at {{SUPPORT_EMAIL}}.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>

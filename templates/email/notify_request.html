<!doctype html>
<html><body style="font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <h3 style="margin:0 0 8px;color:#0A4E73">New Data Request</h3>
  <p style="margin:0 0 12px;color:#334155">A new request was submitted on {{DATE}}.</p>
  <table style="border-collapse:collapse;font-size:14px">
    <tr><td style="padding:4px 8px;font-weight:700;color:#0A4E73">Dataset</td><td style="padding:4px 8px">{{DATASET}}</td></tr>
    <tr><td style="padding:4px 8px;font-weight:700;color:#0A4E73">Company</td><td style="padding:4px 8px">{{COMPANY}}</td></tr>
    <tr><td style="padding:4px 8px;font-weight:700;color:#0A4E73">Name</td><td style="padding:4px 8px">{{NAME}}</td></tr>
    <tr><td style="padding:4px 8px;font-weight:700;color:#0A4E73">Email</td><td style="padding:4px 8px">{{EMAIL}}</td></tr>
    <tr><td style="padding:4px 8px;font-weight:700;color:#0A4E73">Phone</td><td style="padding:4px 8px">{{PHONE}}</td></tr>
    <tr><td style="padding:4px 8px;font-weight:700;color:#0A4E73">Notes</td><td style="padding:4px 8px;white-space:pre-wrap">{{NOTES}}</td></tr>
    <tr><td style="padding:4px 8px;font-weight:700;color:#0A4E73">Ref</td><td style="padding:4px 8px">{{REF}}</td></tr>
  </table>
</body></html>
